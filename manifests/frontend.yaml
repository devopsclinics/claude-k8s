apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: budget-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "metrics"
        prometheus.io/port: "5020"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - frontend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: frontend
        image: tbankole/budget-app:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          - |
            apt-get update &&
            apt-get install -y locales &&
            sed -i '/en_US.UTF-8/s/^# //g' /etc/locale.gen &&
            locale-gen &&
            python claudeBudget.py
        ports:
        - containerPort: 5020
          name: http
        env:
        - name: LANG
          value: "en_US.UTF-8"
        - name: LC_ALL
          value: "en_US.UTF-8"
        - name: POSTGRES_HOST
          value: "claude"
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:  # health checks
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: budget-app
spec:
  type: NodePort  # Changed to NodePort for local VM
  ports:
  - port: 80
    targetPort: 5020
    nodePort: 30080  # Added nodePort for local access
  selector:
    app: frontend