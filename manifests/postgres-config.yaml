apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: budget-app
data:
  POSTGRES_DB: "easybudget"
  POSTGRES_USER: "claude-user"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: budget-app
type: Opaque
data:
  POSTGRES_PASSWORD: QmFiYXR1bmRlMDQ=
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claude
  namespace: budget-app
spec:
  serviceName: claude
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:14-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: claude
  namespace: budget-app
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres